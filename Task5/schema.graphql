# ================================
# GraphQL schema для client-info
# ================================

schema {
  query: Query
}

# Корневой тип запросов
type Query {
  # Получение информации о клиенте
  client(id: ID!): Client
}

# Клиент — основная сущность
type Client {
  id: ID!
  name: String
  age: Int

  # Дополнительные связанные данные
  documents: [Document]
  relatives: [Relative]
}

# Документы клиента
type Document {
  id: ID!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

# Родственники клиента
type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}